<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent background: safe for light or dark surfaces -->

  <!-- Base serif / foundation -->
  <rect x="90" y="176" width="60" height="16" rx="8" fill="#F2B705"/>

  <!-- Vertical stem of the I -->
  <rect x="108" y="86" width="24" height="96" rx="10" fill="#F2B705"/>

  <!-- Ascending tip: the stem breaks upward into a rising, pointed trend -->
  <polygon points="104,92 140,92 176,36 148,50" fill="#F2B705"/>

  <!-- Bright accent trend-line running through the tip for depth and motion -->
  <line x1="118" y1="94" x2="168" y2="40" stroke="#FFE27A" stroke-width="5" stroke-linecap="round"/>
</svg>
